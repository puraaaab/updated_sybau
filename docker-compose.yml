services:
  # MediaMTX Streaming Server for RTSP / WebRTC / HLS / RTMP
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: vms_mediamtx
    ports:
      - "9997:9997"  # API
      - "8554:8554"  # RTSP
      - "1935:1935"  # RTMP
      - "8888:8888"  # HLS
      - "8889:8889"  # WebRTC (WHEP)
      - "8189:8189/udp" # WebRTC ICE
    environment:
      - MTX_PROTOCOLS=tcp
      - MTX_HLS=yes
      - MTX_WEBRTC=yes
      - MTX_API=yes
      - MTX_APIADDRESS=:9997
      - MTX_HLSSEGMENTDURATION=1s
      - MTX_HLSPARTDURATION=200ms
      - MTX_HLSSEGMENTCOUNT=30
      - MTX_HLSMAXPLAYLISTS=30
    restart: unless-stopped

  # PostgreSQL 15 for metadata, canonical events, journeys & audit ledgers
  postgres:
    image: postgres:15-alpine
    container_name: vms_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vms_db}
      POSTGRES_USER: ${POSTGRES_USER:-vms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vms_user} -d ${POSTGRES_DB:-vms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Qdrant for vector embeddings (semantic & face search)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vms_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped


  # MinIO Object Storage for video clips, snapshots & redacted privacy derivatives
  minio:
    image: minio/minio:latest
    container_name: vms_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vms_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Kafka + Zookeeper for asynchronous event streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vms_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vms_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped

  # FastAPI Production Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vms_backend
    ports:
      - "7000:8000"


    environment:
      - APP_ENV=${APP_ENV:-production}
      - VMS_SECRET_KEY=${VMS_SECRET_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vms_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vms_db}


      - QDRANT_HOST=qdrant
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - QUEUE_FRAME_MAX_SIZE=${QUEUE_FRAME_MAX_SIZE:-100}
      - QUEUE_INFERENCE_MAX_SIZE=${QUEUE_INFERENCE_MAX_SIZE:-50}
      - QUEUE_RECORDING_MAX_SIZE=${QUEUE_RECORDING_MAX_SIZE:-500}
      - QUEUE_FORENSIC_MAX_SIZE=${QUEUE_FORENSIC_MAX_SIZE:-1000}
      - QUEUE_NOTIFICATION_MAX_SIZE=${QUEUE_NOTIFICATION_MAX_SIZE:-200}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

      minio:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Nginx + Vite Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vms_frontend
    ports:
      - "3000:80"

    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
